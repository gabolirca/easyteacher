<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AulaFácil - Acceso Profesor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#911b00",
                      "surface-dim": "#d9d9e2",
                      "tertiary-fixed-dim": "#ffb694",
                      "tertiary-fixed": "#ffdbcc",
                      "on-primary": "#ffffff",
                      "outline-variant": "#c2c6d4",
                      "surface-container": "#ededf6",
                      "primary-fixed-dim": "#ffc8ac",
                      "primary": "#871a00",
                      "inverse-primary": "#ffc8ac",
                      "surface-container-low": "#f2f3fc",
                      "outline": "#727784",
                      "on-surface": "#191c21",
                      "on-primary-container": "#ffd3bb",
                      "surface": "#f9f9ff",
                      "secondary-fixed": "#b1f0ce",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#ffe6d7",
                      "background": "#f9f9ff",
                      "secondary": "#2c694e",
                      "surface-bright": "#f9f9ff",
                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "primary-container": "#E83C17",
                      "on-primary-fixed": "#401000",
                      "surface-tint": "#b93411",
                      "surface-container-highest": "#e1e2ea",
                      "on-secondary-fixed": "#002114",
                      "tertiary": "#722b00",
                      "surface-container-high": "#e7e8f0",
                      "on-surface-variant": "#424752",
                      "secondary-container": "#aeeecb",
                      "on-secondary-fixed-variant": "#0e5138",
                      "on-tertiary-container": "#ffc2a7",
                      "inverse-surface": "#2e3037",
                      "on-tertiary-fixed-variant": "#7b2f00",
                      "secondary-fixed-dim": "#95d4b3",
                      "on-background": "#191c21",
                      "on-tertiary-fixed": "#351000",
                      "on-secondary-container": "#316e52",
                      "surface-variant": "#e1e2ea",
                      "inverse-on-surface": "#f0f0f9",
                      "tertiary-container": "#983c00"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "24px",
                      "stack-md": "24px",
                      "margin-desktop": "48px",
                      "stack-lg": "40px",
                      "stack-sm": "12px",
                      "margin-mobile": "16px",
                      "base-unit": "8px"
              },
              "fontFamily": {
                      "label-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "button-text": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "label-lg": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "button-text": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md flex items-center justify-center px-4">
<div class="w-full max-w-md">
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-primary font-bold" style="font-size:32px;">AulaFácil</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Portal del profesor</p>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-8 shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
<h2 id="mode-title" class="font-headline-md text-headline-md text-on-surface mb-stack-md">Iniciar sesión</h2>
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<form id="login-form" class="flex flex-col gap-4">
<div id="nombre-field" class="hidden flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="nombre">Tu nombre</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="nombre" placeholder="Ej: Roberto Lira" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="correo">Correo</label>
<input autocomplete="email" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="correo" placeholder="tu@correo.com" required type="email"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="password">Contraseña</label>
<input autocomplete="current-password" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="password" minlength="6" placeholder="••••••••" required type="password"/>
</div>
<button class="mt-2 bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 hover:bg-primary hover:text-on-primary transition-colors" id="submit-btn" type="submit">Entrar</button>
</form>
<button class="w-full text-center mt-4 text-primary font-label-lg text-label-lg hover:underline" id="toggle-mode" type="button">¿Primera vez? Crea tu cuenta</button>
</div>
</div>
<script type="module" src="assets/js/login.js"></script>
</body></html>
