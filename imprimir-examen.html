<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AulaFácil - Imprimir examen</title>
<link rel="icon" href="favicon.ico"/>
<style>
  /* Pagina autonoma, como la hoja de respuestas: lo impreso no depende de
     Tailwind ni de la paleta. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e9ee; font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; }
  .barra { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd;
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; }
  .barra a, .barra button { font: inherit; font-size: 15px; }
  .barra a { color: #333; text-decoration: none; }
  .barra button { background: #111; color: #fff; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .barra .sec { background: #fff; color: #111; border: 1px solid #ccc; padding: 8px 16px; border-radius: 999px; }
  #nota { font-size: 13px; color: #555; }
  .barra select { background: #fff; }
  #aviso { margin: 16px; padding: 12px 14px; border-radius: 10px; background: #fff4e5; border: 1px solid #f1d39a; }

  /* Hoja carta por defecto; imprimir-examen.js cambia el alto si se elige
     oficio. Margenes y pie tienen que coincidir con MARGEN_V y PIE de ahi. */
  #paginas { padding: 18px 0 40px; }
  .pagina { position: relative; width: 215.9mm; min-height: 279.4mm; margin: 0 auto 18px; background: #fff;
            padding: 14mm 18mm 22mm; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 11pt; line-height: 1.4; }
  .pagina.medidor { position: absolute; visibility: hidden; left: -9999px; min-height: 0; }
  .bloque + .bloque { margin-top: 5mm; }
  .pie { position: absolute; left: 0; right: 0; bottom: 8mm; text-align: center; font-size: 8.5pt; color: #777; }
  .cabeza { display: flex; gap: 5mm; align-items: center; border-bottom: .3mm solid #333; padding-bottom: 3mm; margin-bottom: 4mm; }
  .cabeza img { width: 16mm; height: 16mm; object-fit: contain; }
  .cabeza .titulo { font-size: 15pt; font-weight: 700; }
  .linea { display: inline-block; width: 70mm; border-bottom: .25mm solid #444; height: 4mm; vertical-align: bottom; }
  .linea.corta { width: 30mm; }
  .indicacion { font-size: 9.5pt; color: #333; margin-bottom: 5mm; }
  .pregunta { break-inside: avoid; page-break-inside: avoid; }
  .pregunta .enc { font-weight: 600; }
  .pregunta .enc .pts { font-weight: 400; color: #777; font-size: 9pt; }
  .tabla { border-collapse: collapse; margin: 2mm 0 1mm 7mm; font-weight: 400; font-size: 10pt; }
  .tabla th, .tabla td { border: .25mm solid #888; padding: 1mm 2.5mm; text-align: left; vertical-align: top; }
  .tabla th { background: #f2f2f2; font-weight: 700; }
  .plantilla { white-space: pre-wrap; line-height: 2; }
  .renglones { margin: 2mm 0 0 7mm; }
  .renglon { height: 9mm; border-bottom: .25mm solid #999; }
  /* Las instrucciones van ARRIBA de la pregunta, como indicacion de la seccion.
     pre-wrap respeta los saltos de linea (un articulo, una tabla de datos). */
  .pregunta .instr { font-size: 10.5pt; font-weight: 700; color: #111; margin: 0 0 1.5mm; white-space: pre-wrap; }
  .pregunta img.ilustr { max-width: 90mm; max-height: 60mm; display: block; margin: 2mm 0; }
  .opciones { margin: 1.5mm 0 0 7mm; }
  .opciones div { margin: .6mm 0; }
  .opciones.en-linea { display: flex; flex-wrap: wrap; gap: 0 10mm; }
  .letra { font-weight: 700; display: inline-block; width: 6mm; }
  .columnas { display: grid; grid-template-columns: 3fr 2fr; gap: 1mm 8mm; margin: 2mm 0 0 7mm; }
  .columnas .izq .letra, .columnas .izq b { width: auto; }
  .blanco { display: inline-block; min-width: 40mm; border-bottom: .25mm solid #444; }
  .procedimiento { height: 30mm; border: .25mm dashed #999; border-radius: 2mm; margin-top: 2mm; font-size: 8.5pt; color: #999; padding: 1mm 2mm; }
  .donde { font-size: 8.5pt; color: #666; margin-left: 7mm; }

  @page { size: letter portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .barra, #aviso { display: none !important; }
    #paginas { padding: 0; }
    .pagina { box-shadow: none; margin: 0; height: 279.3mm; overflow: hidden; break-after: page; page-break-after: always; }
    /* Una pregunta que no cabe ni sola en una hoja: se deja crecer. */
    .pagina.larga { height: auto; overflow: visible; }
    .pagina:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="barra">
  <a id="link-volver" href="dashboard.html">← Volver</a>
  <select id="tamano" aria-label="Tamaño de hoja" style="font:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid #ccc">
    <option value="carta">Hoja carta</option>
    <option value="oficio">Hoja oficio</option>
  </select>
  <button id="btn-imprimir">Imprimir</button>
  <a id="link-hojas" class="sec" href="#">Hojas de respuestas</a>
  <span id="nota">Imprime una copia por alumno (o proyéctalo). Las respuestas se marcan en la hoja de respuestas.</span>
</div>
<div id="aviso" style="display:none"></div>
<div id="paginas"></div>
<script type="module" src="assets/js/imprimir-examen.js"></script>
</body>
</html>
