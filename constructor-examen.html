<!DOCTYPE html>

<style>
  :root { --cpg-red: #d02b2f; --cpg-red-dark: #97262c; --cpg-gray: #3a3b3e; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .anim-fade { animation: fadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-pop { animation: popIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .card-hover {
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
  }
  .card-hover:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 22px rgba(208, 43, 47, 0.16);
  }
</style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<header class="bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-4xl mx-auto px-6 py-4 flex items-center gap-4">
<a id="link-volver" href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<a href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" title="Ir al inicio" aria-label="Ir al inicio">
<span class="material-symbols-outlined">home</span>
</a>
<h1 class="anim-fade font-headline-md text-headline-md text-on-surface">Constructor de examen</h1>
</div>
</header>

<main class="max-w-4xl mx-auto px-6 py-8 pb-32">
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<div id="ok-box" class="hidden bg-secondary-container text-on-secondary-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>

<!-- Datos del examen -->
<section class="anim-pop bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-6 mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Datos del examen</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col md:col-span-2">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="titulo">Título del examen</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="titulo" placeholder="Ej: Examen parcial - Unidad 3" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="fecha-apertura">Apertura</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="fecha-apertura" type="datetime-local"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="fecha-cierre">Cierre</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="fecha-cierre" type="datetime-local"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="duracion">Duración (minutos)</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="duracion" min="1" placeholder="45" type="number"/>
</div>
<div id="campo-periodo" class="hidden flex flex-col md:col-span-2">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="examen-periodo">Periodo</label>
<select id="examen-periodo" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors">
<option value="">Sin periodo (todo el ciclo)</option>
</select>
</div>
</div>
</section>

<!-- Preguntas -->
<section class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-md">
<h2 class="anim-fade font-headline-md text-headline-md text-on-surface">Preguntas (<span id="contador-preguntas">0</span>)</h2>
</div>

<div id="preguntas-lista" class="flex flex-col gap-4 mb-stack-md"></div>

<!-- Selector de tipo -->
<div id="selector-tipo" class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<button data-tipo="opcion_multiple" class="btn-tipo-pregunta card-hover bg-surface-container-high hover:bg-primary-fixed text-on-surface p-4 rounded-DEFAULT border border-outline-variant flex flex-col items-center gap-2">
<span class="material-symbols-outlined">radio_button_checked</span>
<span class="font-label-lg text-label-lg text-center">Opción múltiple</span>
</button>
<button data-tipo="verdadero_falso" class="btn-tipo-pregunta card-hover bg-surface-container-high hover:bg-primary-fixed text-on-surface p-4 rounded-DEFAULT border border-outline-variant flex flex-col items-center gap-2">
<span class="material-symbols-outlined">rule</span>
<span class="font-label-lg text-label-lg text-center">Verdadero / Falso</span>
</button>
<button data-tipo="relacionar" class="btn-tipo-pregunta card-hover bg-surface-container-high hover:bg-primary-fixed text-on-surface p-4 rounded-DEFAULT border border-outline-variant flex flex-col items-center gap-2">
<span class="material-symbols-outlined">compare_arrows</span>
<span class="font-label-lg text-label-lg text-center">Relacionar columnas</span>
</button>
<button data-tipo="completar" class="btn-tipo-pregunta card-hover bg-surface-container-high hover:bg-primary-fixed text-on-surface p-4 rounded-DEFAULT border border-outline-variant flex flex-col items-center gap-2">
<span class="material-symbols-outlined">edit_note</span>
<span class="font-label-lg text-label-lg text-center">Completar</span>
</button>
</div>

<!-- Panel de edición de pregunta (se llena dinámicamente según el tipo elegido) -->
<div id="panel-pregunta" class="hidden bg-surface-container-lowest border-2 border-primary-fixed rounded-DEFAULT p-6 mt-stack-md"></div>
</section>

<!-- Link generado -->
<!-- Link generado -->
<section id="seccion-link" class="hidden bg-secondary-fixed text-on-secondary-fixed border border-secondary-fixed-dim rounded-DEFAULT p-6 mb-stack-lg">
<h2 class="font-headline-md text-headline-md mb-2">Link del examen</h2>
<div class="flex items-center gap-2 bg-surface rounded-DEFAULT p-3">
<code id="link-examen" class="flex-1 text-on-surface font-body-md text-body-md break-all"></code>
<button id="btn-copiar-link" class="text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" aria-label="Copiar link">
<span class="material-symbols-outlined">content_copy</span>
</button>
</div>
<div class="flex flex-col items-center gap-3 mt-stack-md">
<div id="qr-container" class="bg-white p-4 rounded-DEFAULT inline-block"></div>
<p class="font-body-md text-body-md text-on-secondary-fixed text-center max-w-sm">Los alumnos escanean este código con la cámara de su celular y entran directo — deja de funcionar automáticamente después de la hora de cierre del examen.</p>
<button id="btn-descargar-qr" class="text-primary bg-surface hover:bg-surface-container-high px-4 py-2 rounded-full font-button-text text-button-text transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">download</span> Descargar QR
</button>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</main>

<!-- Barra inferior fija -->
<div class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant py-4 px-6 flex justify-end gap-4">
<button id="btn-guardar-examen" class="card-hover bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 px-8 hover:bg-primary hover:text-on-primary transition-colors">Guardar examen</button>
<button id="btn-generar-link" class="card-hover bg-primary text-on-primary font-button-text text-button-text rounded-full py-3 px-8 hover:opacity-90 transition-opacity" disabled>Generar link del examen</button>
</div>

<script type="module" src="assets/js/constructor-examen.js"></script>
<script type="module" src="assets/js/recargar.js"></script>
</body></html>
