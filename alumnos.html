<style>
  :root { --cpg-red: #d02b2f; --cpg-red-dark: #97262c; --cpg-gray: #3a3b3e; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .anim-fade { animation: fadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-pop { animation: popIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .card-hover {
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
  }
  .card-hover:hover {
    transform: translateY(-3px) scale(1.006);
    box-shadow: 0 12px 24px rgba(208, 43, 47, 0.1);
  }

  .avatar-inicial {
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fbe1db;
    color: var(--cpg-red);
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .input-cpg:focus, .buscador-cpg:focus {
    border-color: var(--cpg-red) !important;
    box-shadow: 0 0 0 3px rgba(208, 43, 47, 0.15);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<body class="bg-background text-on-background min-h-screen font-body-md">
<header class="bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-4">
<a id="link-volver" href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<a href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" title="Ir al inicio" aria-label="Ir al inicio">
<span class="material-symbols-outlined">home</span>
</a>
<div>
<h1 class="anim-fade font-headline-md text-headline-md text-on-surface">Alumnos</h1>
<p id="grupo-nombre" class="font-body-md text-body-md text-on-surface-variant"></p>
</div>
</div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<div id="ok-box" class="hidden bg-secondary-container text-on-secondary-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>

<!-- Agregar alumno -->
<div class="anim-pop card-hover bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-6 mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md flex items-center justify-between">
Agregar alumno a este grupo
<button id="btn-importar-excel" class="text-primary hover:bg-surface-container-high px-3 py-2 rounded-DEFAULT transition-colors font-label-lg text-label-lg flex items-center gap-2">
<span class="material-symbols-outlined">upload_file</span> Importar lista (Excel)
</button>
</h2>
<input id="input-excel" type="file" accept=".xlsx,.xls,.csv" class="hidden"/>
<div class="flex flex-col md:flex-row gap-4 items-end">
<div class="flex-1 flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="nuevo-nombre">Nombre</label>
<input class="input-cpg px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface outline-none font-body-md text-body-md text-on-surface transition-colors" id="nuevo-nombre" placeholder="Ej: Ana González" type="text"/>
</div>
<div class="flex-1 flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="nuevo-id">Matrícula/Correo</label>
<div class="flex gap-2">
<input class="input-cpg flex-1 px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface outline-none font-body-md text-body-md text-on-surface transition-colors" id="nuevo-id" placeholder="Ej: 2330774" type="text"/>
<button type="button" id="btn-generar-matricula" title="Generar matrícula única al azar" class="px-3 rounded-DEFAULT border border-outline-variant hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">casino</span>
</button>
</div>
</div>
<button id="btn-agregar-alumno" class="card-hover h-[50px] px-6 bg-secondary text-on-secondary font-button-text text-button-text rounded-DEFAULT hover:opacity-90 transition-colors flex items-center gap-2 whitespace-nowrap">
<span class="material-symbols-outlined">add</span> Agregar
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-3">Si la matrícula ya existe (el alumno ya tiene cuenta en otro grupo), solo se inscribe aquí — no se crea una cuenta duplicada.</p>
</div>

<input id="buscador-alumnos" type="text" placeholder="Buscar alumno..." class="buscador-cpg px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface outline-none font-body-md text-body-md text-on-surface transition-colors w-full max-w-sm mb-stack-md"/>

<!-- Lista -->
<div class="anim-pop bg-surface-container-lowest border border-outline-variant rounded-DEFAULT overflow-hidden">
<table class="w-full">
<thead class="bg-surface-container-high">
<tr>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Nombre</th>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Matrícula</th>
<th class="text-right py-3 px-6 font-label-lg text-label-lg text-on-surface">Acciones</th>
</tr>
</thead>
<tbody id="tabla-alumnos-body">
<tr><td colspan="3" class="py-6 px-6 text-center text-on-surface-variant">Cargando...</td></tr>
</tbody>
</table>
</div>
</main>
<script type="module" src="assets/js/alumnos.js"></script>
</body></html>
