<style>
  :root { --cpg-red: #d02b2f; --cpg-red-dark: #97262c; --cpg-gray: #3a3b3e; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim-fade { animation: fadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-pop { animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .icono-tarea-grande {
    width: 52px;
    height: 52px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #fbe1db;
    color: var(--cpg-red);
  }

  .input-calificacion:focus, .buscador-cpg:focus {
    border-color: var(--cpg-red) !important;
    box-shadow: 0 0 0 3px rgba(208, 43, 47, 0.15);
  }

  .chk-entregado {
    accent-color: var(--cpg-red);
  }
</style>

<body class="bg-background text-on-background min-h-screen font-body-md">
<header class="bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-4">
<a id="link-volver" href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">arrow_back</span>

<a href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" title="Ir al inicio" aria-label="Ir al inicio">
<span class="material-symbols-outlined">home</span>
</a>
<div class="icono-tarea-grande">
<span id="icono-tarea" class="material-symbols-outlined text-2xl">assignment</span>
</div>
<div>
<h1 id="tarea-titulo" class="font-headline-md text-headline-md text-on-surface">Cargando...</h1>
<p id="tarea-info" class="font-body-md text-body-md text-on-surface-variant"></p>
</div>
</div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8 pb-32">
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<div id="ok-box" class="hidden bg-secondary-container text-on-secondary-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>

<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-stack-md">
<input id="buscador-alumnos" type="text" placeholder="Buscar alumno..." class="buscador-cpg px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface outline-none font-body-md text-body-md text-on-surface transition-colors w-full md:max-w-sm"/>
<span id="contador-calificados" class="font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap"></span>
</div>

<div class="anim-pop bg-surface-container-lowest border border-outline-variant rounded-DEFAULT overflow-hidden">
<table class="w-full">
<thead class="bg-surface-container-high">
<tr>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Alumno</th>
<th class="text-center py-3 px-6 font-label-lg text-label-lg text-on-surface">Entregó</th>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Calificación</th>
</tr>
</thead>
<tbody id="tabla-alumnos-body">
<tr><td colspan="3" class="py-6 px-6 text-center text-on-surface-variant">Cargando...</td></tr>
</tbody>
</table>
</div>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant py-4 px-6 flex justify-end">
<button id="btn-guardar-calificaciones" class="bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 px-8 hover:bg-primary hover:text-on-primary transition-colors">Guardar calificaciones</button>
