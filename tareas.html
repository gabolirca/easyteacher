<style>
  :root { --cpg-red: #d02b2f; --cpg-red-dark: #97262c; --cpg-gray: #3a3b3e; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(26px) scale(0.93); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim-fade { animation: fadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .card-hover {
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
  }
  .card-hover:hover {
    transform: translateY(-4px) scale(1.012);
    box-shadow: 0 14px 28px rgba(208, 43, 47, 0.14);
  }

  .icono-tarea {
    width: 48px;
    height: 48px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #fbe1db;
    color: var(--cpg-red);
    transition: transform 0.2s cubic-bezier(0.22,1,0.36,1);
  }
  .card-hover:hover .icono-tarea { transform: scale(1.1) rotate(-4deg); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<header class="bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-4">
<a id="link-volver" href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<a href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" title="Ir al inicio" aria-label="Ir al inicio">
<span class="material-symbols-outlined">home</span>
</a>
<div>
<h1 class="anim-fade font-headline-md text-headline-md text-on-surface">Tareas</h1>
<p id="grupo-nombre" class="font-body-md text-body-md text-on-surface-variant"></p>
</div>
</div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<div id="ok-box" class="hidden bg-secondary-container text-on-secondary-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>

<div class="flex justify-between items-center mb-stack-md">
<h2 class="anim-fade font-headline-md text-headline-md text-on-surface">Tareas del grupo</h2>
<button id="btn-nueva-tarea" class="card-hover bg-primary text-on-primary px-6 py-2 rounded-full font-button-text text-button-text hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">+ Nueva tarea</button>
</div>

<!-- Formulario de nueva tarea (oculto hasta que le den clic al botón) -->
<div id="form-nueva-tarea" class="hidden bg-surface-container-lowest border-2 border-primary-fixed rounded-DEFAULT p-6 mb-stack-md">
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter mb-4">
<div class="flex flex-col md:col-span-1">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="tarea-titulo">Título</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="tarea-titulo" placeholder="Ej: Tarea 3 - Ejercicios" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="tarea-fecha-limite">Fecha límite</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="tarea-fecha-limite" type="date"/>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="tarea-peso">Peso (dentro de tareas)</label>
<input class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors" id="tarea-peso" min="0" step="0.1" type="number" value="1"/>
</div>
</div>
<div id="campo-periodo-tarea" class="hidden flex flex-col mb-4">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="tarea-periodo">Periodo</label>
<select id="tarea-periodo" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors">
<option value="">Sin periodo (todo el ciclo)</option>
</select>
</div>
<div class="flex gap-4">
<button id="btn-guardar-tarea" class="bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 px-8 hover:bg-primary hover:text-on-primary transition-colors">Guardar tarea</button>
<button id="btn-cancelar-tarea" class="text-on-surface-variant font-button-text text-button-text py-3 px-8 hover:bg-surface-container-high rounded-full transition-colors">Cancelar</button>
</div>
</div>

<div id="tareas-container" class="flex flex-col gap-4">
<p class="text-on-surface-variant">Cargando tareas...</p>
</div>
</main>
<script type="module" src="assets/js/tareas.js"></script>
<script type="module" src="assets/js/recargar.js"></script>
</body></html>
