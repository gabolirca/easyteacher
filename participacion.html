<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="page-title">AulaFácil - Participación</title>

                      "primary-fixed-dim": "#ffc8ac",

                      "surface-container-low": "#f2f3fc",
                      "outline": "#727784",

                      "surface": "#f9f9ff",
                      "secondary-fixed": "#b1f0ce",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#ffe6d7",
                      "background": "#f9f9ff",
                      "secondary": "#2c694e",

<body class="bg-background text-on-background min-h-screen font-body-md">
<header class="bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-4">
<a id="link-volver" href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<a href="dashboard.html" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" title="Ir al inicio" aria-label="Ir al inicio">
<span class="material-symbols-outlined">home</span>
</a>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Participación</h1>
<p id="grupo-nombre" class="font-body-md text-body-md text-on-surface-variant"></p>
</div>
</div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8 pb-32">
<div id="error-box" class="hidden bg-error-container text-on-error-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>
<div id="ok-box" class="hidden bg-secondary-container text-on-secondary-container rounded-DEFAULT p-4 mb-stack-md font-body-md text-body-md"></div>

<!-- ============ MODO SIMPLE (una nota 0-10, como Tareas) ============ -->
<div id="vista-simple" class="hidden">
<div id="campo-periodo-simple" class="hidden flex flex-col mb-stack-md max-w-xs">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="simple-periodo">Periodo</label>
<select id="simple-periodo" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors">
<option value="">Sin periodo (todo el ciclo)</option>
</select>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT overflow-hidden">
<table class="w-full">
<thead class="bg-surface-container-high">
<tr>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Alumno</th>
<th class="text-left py-3 px-6 font-label-lg text-label-lg text-on-surface">Calificación (0-10)</th>
</tr>
</thead>
<tbody id="tabla-simple-body">
<tr><td colspan="2" class="py-6 px-6 text-center text-on-surface-variant">Cargando...</td></tr>
</tbody>
</table>
</div>
<div class="flex justify-end mt-stack-md">
<button id="btn-guardar-simple" class="bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 px-8 hover:bg-primary hover:text-on-primary transition-colors">Guardar calificaciones</button>
</div>
</div>

<!-- ============ MODO FICHAS ============ -->
<div id="vista-fichas" class="hidden">
<div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-stack-md">
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="fecha-participacion">Fecha</label>
<input id="fecha-participacion" type="date" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors"/>
</div>
<div id="leyenda-fichas" class="flex gap-3 text-sm font-label-lg text-label-lg text-on-surface-variant flex-wrap"></div>
</div>

<div id="lista-alumnos" class="flex flex-col gap-2 mb-stack-lg">
<p class="text-on-surface-variant">Cargando alumnos...</p>
</div>

<div class="flex flex-wrap gap-4 mb-stack-md">
<button id="btn-toggle-registro" class="text-on-surface-variant font-label-lg text-label-lg hover:text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-lg">history</span> Ver registro de esta fecha
</button>
<button id="btn-toggle-valores" class="text-on-surface-variant font-label-lg text-label-lg hover:text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-lg">tune</span> Editar valores de las fichas
</button>
<button id="btn-toggle-corte" class="text-primary font-label-lg text-label-lg hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-lg">leaderboard</span> Hacer corte
</button>
</div>

<div id="registro-container" class="hidden flex-col gap-2 mb-stack-lg"></div>

<!-- Editor de valores de fichas -->
<div id="valores-container" class="hidden bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-6 mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Valor de cada ficha</h2>
<div id="valores-lista" class="grid grid-cols-2 md:grid-cols-4 gap-gutter mb-stack-md"></div>
<button id="btn-guardar-valores" class="bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full py-3 px-8 hover:bg-primary hover:text-on-primary transition-colors">Guardar valores</button>
</div>

<!-- Corte -->
<div id="corte-container" class="hidden bg-surface-container-lowest border-2 border-primary-fixed rounded-DEFAULT p-6 mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Ranking y corte</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">De mayor a menor. Elige un valor de referencia — quien lo alcance o supere saca 10; los demás se califican en proporción.</p>
<div id="ranking-lista" class="flex flex-col gap-2 mb-stack-md"></div>
<div id="campo-periodo-corte" class="hidden flex flex-col mb-stack-md max-w-xs">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="corte-periodo">Periodo</label>
<select id="corte-periodo" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors">
<option value="">Sin periodo (todo el ciclo)</option>
</select>
</div>
<div class="flex flex-col md:flex-row gap-4 items-end">
<div class="flex-1 flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-2" for="corte-media">Valor de referencia</label>
<input id="corte-media" type="number" min="0" step="1" class="px-4 py-3 rounded-DEFAULT border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none font-body-md text-body-md text-on-surface transition-colors"/>
</div>
<button id="btn-aplicar-corte" class="bg-primary text-on-primary font-button-text text-button-text rounded-full py-3 px-8 hover:opacity-90 transition-opacity whitespace-nowrap">Aplicar corte</button>
</div>
<p id="ultimo-corte-info" class="font-body-md text-body-md text-on-surface-variant mt-stack-md"></p>
</div>
</div>
</main>
<script type="module" src="assets/js/participacion.js"></script>
</body></html>
